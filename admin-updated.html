
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة إدارة كن ذا أثر</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101410;color:#eee;font-family:Tahoma,Arial,sans-serif}
header{background:#1d251d;padding:20px;text-align:center;border-bottom:2px solid #c69b42}
h1{color:#d8b45c;margin:0 0 8px}
main{max-width:1100px;margin:25px auto;padding:15px}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}
button{cursor:pointer;border:0;border-radius:7px;padding:11px 16px;background:#c69b42;color:#151515;font-weight:bold}
nav button{background:#293329;color:white}
nav button.active{background:#c69b42;color:#111}
section{display:none;background:#1b221b;padding:18px;border-radius:12px;margin-bottom:20px}
section.active{display:block}
input,textarea,select{width:100%;padding:12px;margin:7px 0 13px;background:#101710;color:white;border:1px solid #526052;border-radius:7px}
textarea{min-height:75px}
.item{background:#293329;padding:13px;margin:10px 0;border-radius:8px}
.item button{margin:5px 3px}
.danger{background:#a33;color:white}
.green{background:#39794b;color:white}
.small{color:#bbb;font-size:13px}
.image-preview{display:none;max-width:220px;max-height:160px;object-fit:contain;border:1px solid #526052;border-radius:8px;margin:0 0 12px;background:#101710}
#message{padding:10px;color:#e5c879}
.hidden{display:none}
</style>
</head>
<body>
<header>
<h1>كن ذا أثر</h1>
<p>لوحة الإدارة والتحكم</p>
</header>

<main>
<div id="login">
<h2>تسجيل دخول المدير</h2>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">
<button onclick="login()">دخول</button>
</div>

<div id="dashboard" class="hidden">
<p>مرحباً بك في لوحة الإدارة</p>
<nav>
<button class="active" onclick="showTab('projects',this)">المشاريع</button>
<button onclick="showTab('categories',this)">التصنيفات</button>
<button onclick="showTab('contributions',this)">المساهمات</button>
<button onclick="showTab('beneficiaries',this)">المستفيدون</button>
<button onclick="showTab('volunteers',this)">المتطوعون</button>
</nav>

<section id="projects" class="active">
<h2>إدارة المشاريع</h2>
<input id="pTitle" placeholder="اسم المشروع">
<input id="pSlug" placeholder="رابط المشروع المختصر (اختياري)">
<select id="pCategory"><option value="">اختر التصنيف</option></select>
<textarea id="pSummary" placeholder="نبذة مختصرة"></textarea>
<textarea id="pDescription" placeholder="تفاصيل المشروع"></textarea>
<label for="pImage">صورة المشروع</label>
<input id="pImage" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
<img id="pImagePreview" class="image-preview" alt="معاينة صورة المشروع">
<p class="small">اختر صورة بصيغة JPG أو PNG أو WebP، وبحجم لا يتجاوز 5 ميجابايت.</p>
<input id="pLocation" placeholder="الموقع">
<input id="pTarget" type="number" placeholder="المبلغ المستهدف">
<input id="pBeneficiaries" type="number" placeholder="عدد المستفيدين">
<select id="pStatus">
<option value="published">منشور ومتاح للمساهمة</option>
<option value="draft">مسودة</option>
<option value="in_progress">قيد التنفيذ</option>
<option value="completed">مكتمل</option>
<option value="paused">متوقف مؤقتاً</option>
</select>
<button onclick="saveProject()">حفظ المشروع</button>
<button class="danger" onclick="clearProject()">إلغاء التعديل</button>
<div id="projectList"></div>
</section>

<section id="categories">
<h2>إدارة التصنيفات</h2>
<input id="cName" placeholder="اسم التصنيف">
<input id="cIcon" placeholder="الأيقونة، مثال 💧">
<textarea id="cDescription" placeholder="وصف التصنيف"></textarea>
<button onclick="saveCategory()">إضافة التصنيف</button>
<div id="categoryList"></div>
</section>

<section id="contributions">
<h2>طلبات المساهمات</h2>
<p class="small">راجع التحويل أولاً، ثم اعتمد المساهمة أو ارفضها.</p>
<div id="contributionList"></div>
</section>

<section id="beneficiaries">
<h2>إدارة المستفيدين</h2>
<input id="bName" placeholder="اسم المستفيد">
<input id="bPhone" placeholder="رقم الهاتف">
<input id="bLocation" placeholder="المنطقة">
<input id="bType" placeholder="نوع المساعدة">
<textarea id="bNotes" placeholder="ملاحظات"></textarea>
<button onclick="saveBeneficiary()">إضافة مستفيد</button>
<div id="beneficiaryList"></div>
</section>

<section id="volunteers">
<h2>طلبات التطوع</h2>
<div id="volunteerList"></div>
</section>

<button class="danger" onclick="logout()">تسجيل الخروج</button>
</div>
<div id="message"></div>
</main>

<script>
const db = window.supabaseClient;
let editProjectId = null;\nlet currentProjectImageUrl = "";

function msg(t){document.getElementById("message").textContent=t}

document.getElementById("pImage").addEventListener("change", function(){
 const file=this.files[0];
 const preview=document.getElementById("pImagePreview");
 if(!file){return}
 if(!["image/jpeg","image/png","image/webp","image/gif"].includes(file.type)){
  msg("الصيغ المسموحة: JPG وPNG وWebP وGIF.");
  this.value="";
  return;
 }
 if(file.size>5*1024*1024){
  msg("حجم الصورة أكبر من 5 ميجابايت. اختر صورة أصغر.");
  this.value="";
  return;
 }
 preview.src=URL.createObjectURL(file);
 preview.style.display="block";
});
function showTab(id,btn){
 document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");
 loadAll();
}

async function login(){
 const {data,error}=await db.auth.signInWithPassword({
  email:email.value.trim(),password:password.value
 });
 if(error){msg("تعذر تسجيل الدخول: "+error.message);return}
 const {data:role,error:roleError}=await db.from("user_roles")
  .select("role").eq("user_id",data.user.id).maybeSingle();
 if(roleError || !role || !["admin","supervisor"].includes(role.role)){
  await db.auth.signOut();msg("هذا الحساب غير مصرح له بدخول اللوحة.");return;
 }
 if(role.role!=="admin"){
  await db.auth.signOut();msg("هذه اللوحة مخصصة للمدير حالياً.");return;
 }
 loginBox();
}

function loginBox(){
 document.getElementById("login").classList.add("hidden");
 document.getElementById("dashboard").classList.remove("hidden");
 msg("تم تسجيل الدخول.");
 loadAll();
}

async function logout(){
 await db.auth.signOut();
 location.reload();
}

async function loadAll(){
 await Promise.all([
  loadCategories(),loadProjects(),loadContributions(),
  loadBeneficiaries(),loadVolunteers()
 ]);
}

async function loadCategories(){
 const {data,error}=await db.from("categories").select("*").order("created_at",{ascending:false});
 if(error){msg(error.message);return}
 pCategory.innerHTML='<option value="">اختر التصنيف</option>';
 categoryList.innerHTML="";
 (data||[]).forEach(c=>{
  pCategory.innerHTML+=`<option value="${c.id}">${safe(c.name)}</option>`;
  categoryList.innerHTML+=`<div class="item"><b>${safe(c.icon||"")} ${safe(c.name)}</b><p>${safe(c.description||"")}</p><button class="danger" onclick="deleteCategory('${c.id}')">حذف</button></div>`;
 });
}

async function saveCategory(){
 const name=cName.value.trim();
 if(!name){msg("اكتب اسم التصنيف");return}
 const {error}=await db.from("categories").insert({
  name,icon:cIcon.value.trim(),description:cDescription.value.trim(),is_active:true
 });
 if(error){msg(error.message);return}
 cName.value=cIcon.value=cDescription.value="";
 msg("تمت إضافة التصنيف");
 loadCategories();
}

async function deleteCategory(id){
 if(!confirm("هل تريد حذف التصنيف؟"))return;
 const {error}=await db.from("categories").delete().eq("id",id);
 msg(error?error.message:"تم الحذف");
 loadCategories();
}

async function loadProjects(){
 const {data,error}=await db.from("projects").select("*").order("created_at",{ascending:false});
 if(error){msg(error.message);return}
 projectList.innerHTML="";
 (data||[]).forEach(p=>{
  projectList.innerHTML+=`<div class="item">
  <b>${safe(p.title)}</b><p>${safe(p.status||"")}</p>
  <button onclick="editProject('${p.id}')">تعديل</button>
  <button class="danger" onclick="deleteProject('${p.id}')">حذف</button>
  </div>`;
 });
}

async function uploadProjectImage(file){
 if(!file)return currentProjectImageUrl;
 if(!["image/jpeg","image/png","image/webp","image/gif"].includes(file.type))throw new Error("الصيغ المسموحة: JPG وPNG وWebP وGIF.");
 if(file.size>5*1024*1024)throw new Error("حجم الصورة يجب ألا يتجاوز 5 ميجابايت.");

 const extension=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");
 const filePath=`${Date.now()}-${crypto.randomUUID()}.${extension||"jpg"}`;
 const {error:uploadError}=await db.storage
  .from("project-images")
  .upload(filePath,file,{cacheControl:"3600",upsert:false,contentType:file.type});

 if(uploadError)throw uploadError;

 const {data}=db.storage.from("project-images").getPublicUrl(filePath);
 if(!data?.publicUrl)throw new Error("تعذر الحصول على رابط الصورة.");
 return data.publicUrl;
}

async function saveProject(){
 const title=pTitle.value.trim();
 if(!title){msg("اكتب اسم المشروع");return}
 const record={
  title,slug:pSlug.value.trim()||"project-"+Date.now(),
  category_id:pCategory.value||null,
  summary:pSummary.value.trim(),description:pDescription.value.trim(),
  cover_image_url:imageUrl,location:pLocation.value.trim(),
  target_amount:Number(pTarget.value)||null,
  beneficiary_count:Number(pBeneficiaries.value)||null,
  currency:"SDG",status:pStatus.value,
  published_at:pStatus.value==="published"?new Date().toISOString():null
 };
 const result=editProjectId
  ?await db.from("projects").update(record).eq("id",editProjectId)
  :await db.from("projects").insert(record);
 if(result.error){msg(result.error.message);return}
 clearProject();msg("تم حفظ المشروع");loadProjects();
}

async function editProject(id){
 const {data,error}=await db.from("projects").select("*").eq("id",id).single();
 if(error){msg(error.message);return}
 editProjectId=id;
 pTitle.value=data.title||"";pSlug.value=data.slug||"";
 pCategory.value=data.category_id||"";
 pSummary.value=data.summary||"";pDescription.value=data.description||"";
 currentProjectImageUrl=data.cover_image_url||"";
 const preview=document.getElementById("pImagePreview");
 if(currentProjectImageUrl){preview.src=currentProjectImageUrl;preview.style.display="block";}
 else{preview.removeAttribute("src");preview.style.display="none";}
 pImage.value="";pLocation.value=data.location||"";
 pTarget.value=data.target_amount||"";pBeneficiaries.value=data.beneficiary_count||"";
 pStatus.value=data.status||"draft";
 window.scrollTo({top:0,behavior:"smooth"});
}

function clearProject(){
 editProjectId=null;
 ["pTitle","pSlug","pSummary","pDescription","pImage","pLocation","pTarget","pBeneficiaries"].forEach(id=>document.getElementById(id).value="");
 currentProjectImageUrl="";
 const preview=document.getElementById("pImagePreview");
 preview.removeAttribute("src");
 preview.style.display="none";
 pCategory.value="";pStatus.value="published";
}

async function deleteProject(id){
 if(!confirm("هل تريد حذف المشروع؟"))return;
 const {error}=await db.from("projects").delete().eq("id",id);
 msg(error?error.message:"تم حذف المشروع");loadProjects();
}

async function loadContributions(){
 const {data,error}=await db.from("contributions").select("*").order("created_at",{ascending:false});
 if(error){msg(error.message);return}
 contributionList.innerHTML="";
 (data||[]).forEach(c=>{
  contributionList.innerHTML+=`<div class="item">
  <b>${safe(c.donor_name)}</b>
  <p>الهاتف: ${safe(c.donor_phone)} | المبلغ: ${safe(c.amount)} ${safe(c.currency||"")}</p>
  <p>طريقة الدفع: ${safe(c.payment_method)} | رقم العملية: ${safe(c.transaction_reference||"—")}</p>
  <p>الحالة: ${safe(c.status)}</p>
  <button class="green" onclick="reviewContribution('${c.id}','verified')">اعتماد</button>
  <button class="danger" onclick="reviewContribution('${c.id}','rejected')">رفض</button>
  </div>`;
 });
}

async function reviewContribution(id,status){
 if(!confirm("هل تحققت من التحويل وتريد تغيير الحالة؟"))return;
 const {data:userData}=await db.auth.getUser();
 const {error}=await db.from("contributions").update({
  status,reviewed_at:new Date().toISOString(),reviewed_by:userData.user.id
 }).eq("id",id);
 msg(error?error.message:"تم تحديث حالة المساهمة");
 loadContributions();
}

async function saveBeneficiary(){
 const full_name=bName.value.trim();
 if(!full_name){msg("اكتب اسم المستفيد");return}
 const {error}=await db.from("beneficiaries").insert({
  full_name,phone:bPhone.value.trim(),location:bLocation.value.trim(),
  assistance_type:bType.value.trim(),notes:bNotes.value.trim(),status:"active"
 });
 if(error){msg(error.message);return}
 ["bName","bPhone","bLocation","bType","bNotes"].forEach(id=>document.getElementById(id).value="");
 msg("تمت إضافة المستفيد");loadBeneficiaries();
}

async function loadBeneficiaries(){
 const {data,error}=await db.from("beneficiaries").select("*").order("created_at",{ascending:false});
 if(error){msg(error.message);return}
 beneficiaryList.innerHTML="";
 (data||[]).forEach(b=>{
  beneficiaryList.innerHTML+=`<div class="item"><b>${safe(b.full_name)}</b>
  <p>${safe(b.phone||"")} — ${safe(b.location||"")} — ${safe(b.assistance_type||"")}</p>
  <p>الحالة: ${safe(b.status)}</p>
  <button onclick="beneficiaryStatus('${b.id}','completed')">إكمال الحالة</button>
  <button class="danger" onclick="deleteBeneficiary('${b.id}')">حذف</button></div>`;
 });
}

async function beneficiaryStatus(id,status){
 const {error}=await db.from("beneficiaries").update({status}).eq("id",id);
 msg(error?error.message:"تم تحديث الحالة");loadBeneficiaries();
}

async function deleteBeneficiary(id){
 if(!confirm("حذف سجل المستفيد؟"))return;
 const {error}=await db.from("beneficiaries").delete().eq("id",id);
 msg(error?error.message:"تم الحذف");loadBeneficiaries();
}

async function loadVolunteers(){
 const {data,error}=await db.from("volunteers").select("*").order("created_at",{ascending:false});
 if(error){msg(error.message);return}
 volunteerList.innerHTML="";
 (data||[]).forEach(v=>{
  volunteerList.innerHTML+=`<div class="item"><b>${safe(v.full_name)}</b>
  <p>الهاتف: ${safe(v.phone)} | المنطقة: ${safe(v.location||"")}</p>
  <p>المهارات: ${safe(v.skills||"")} | التوفر: ${safe(v.availability||"")}</p>
  <p>الحالة: ${safe(v.status)}</p>
  <button class="green" onclick="volunteerStatus('${v.id}','approved')">قبول</button>
  <button class="danger" onclick="volunteerStatus('${v.id}','rejected')">رفض</button>
  </div>`;
 });
}

async function volunteerStatus(id,status){
 const {error}=await db.from("volunteers").update({status}).eq("id",id);
 msg(error?error.message:"تم تحديث الطلب");loadVolunteers();
}

function safe(value){
 return String(value??"").replace(/[&<>"']/g,ch=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[ch]));
}

(async()=>{
 const {data}=await db.auth.getSession();
 if(data.session){
  const {data:role}=await db.from("user_roles").select("role")
   .eq("user_id",data.session.user.id).maybeSingle();
  if(role?.role==="admin")loginBox();
 }
})();
</script>
</body>
</html>
